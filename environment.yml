# Combined conda environment for the spectrum-to-fp-design project
# (fpbase-extractor data tooling + ESM-2 surrogate/oracle modeling + design campaigns).
#
# Device is auto-detected at runtime: CUDA -> MPS -> CPU. Every result in this repo was
# produced on Linux + CUDA (an L4). Apple Silicon works too — macOS has no CUDA, so the
# arm64 `torch` wheel's MPS (Metal) backend is used instead; set
# PYTORCH_ENABLE_MPS_FALLBACK=1 for any op MPS doesn't implement.
#
# Create from THIS directory (the project root) so the editable fpbase-extractor
# install path resolves:
#     conda env create -f environment.yml
#     conda activate spectrum-to-fp-design
#
# `fpdesign/` is NOT installed — the folders that use it (dataset_pipeline/, GFP_DMS/,
# design-campaign-EGFP/) put the repo root on sys.path at the top of each script.
#
# Specs are left unpinned, but the results in this repo were produced with:
#   python 3.10.20 · torch 2.13.0 · numpy 1.26.4 · transformers 5.14.0
#   scikit-learn 1.7.2 · scipy 1.15.2 · pandas 2.3.3 · matplotlib 3.10.9
#   seaborn 0.13.2 · plotly 6.9.0 · arcadia-pycolor 0.8.0 · mafft 7.526
name: spectrum-to-fp-design
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # notebooks / tooling
  - jupyter
  - nbconvert           # `jupyter nbconvert --execute` re-runs the figure notebooks
  - matplotlib
  - seaborn             # categorical strips/violins in the campaign + design notebooks
  # scientific stack
  - numpy<2             # fair-esm needs numpy; <2 avoids torch ABI mismatch
  - pandas              # fpbase-extractor analysis notebooks
  - scipy               # dendrograms / clustering
  - scikit-learn        # PCA / mutual-information notebooks
  - biopython           # PairwiseAligner (sequence identity)
  - openpyxl            # design-campaign-EGFP/xlsx_io.py writes the order spreadsheets
  - fonttools           # dataset_pipeline/fetch_arcadia_fonts.py cuts the Atkinson faces
  - pytest              # fpbase-extractor tests
  # external tools
  - mafft               # msa_conservation/run_msa.sh builds the family alignment
  - pip:
      - fair-esm>=2.0.0
      - torch>=2.0          # CUDA build on Linux; the arm64 macOS wheel includes MPS
      - transformers        # ProstT5 encoder (Rostlab/ProstT5) for the structure-aware oracle
      - sentencepiece       # ProstT5 T5Tokenizer backend
      - protobuf            # sentencepiece model loading
      - biotite            # multiple sequence alignment + plotting
      - plotly             # standalone HTML ruggedness scenes (write_html; no kaleido needed)
      - arcadia-pycolor   # Arcadia plot styling (apc)
      - -e ./fpbase-extractor   # installs the `fpbase-extract` CLI + fpbase_extractor package
