# Combined conda environment for the esm2_fp_design project
# (fpbase-extractor data tooling + design ESM-2 modeling).
#
# Apple Silicon (arm64) friendly: macOS has no CUDA — the arm64 `torch` wheel below
# ships the MPS (Metal) GPU backend, used automatically. CPU fallback for any
# unsupported op: PYTORCH_ENABLE_MPS_FALLBACK=1
#
# Create from THIS directory (the project root) so the editable fpbase-extractor
# install path resolves:
#     conda env create -f environment.yml
#     conda activate esm2-fp-design
name: esm2-fp-design
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # notebooks / tooling
  - jupyter
  - nbconvert
  - ipywidgets          # interactive sliders in fpbase_cluster.ipynb
  - matplotlib
  - cairosvg            # SVG -> PNG figure export
  # scientific stack
  - numpy<2             # fair-esm needs numpy; <2 avoids torch ABI mismatch
  - pandas              # fpbase-extractor analysis notebooks
  - scipy               # dendrograms / clustering
  - scikit-learn        # PCA / mutual-information notebooks
  - biopython           # PairwiseAligner (sequence identity)
  - pytest              # fpbase-extractor tests
  - pip:
      - fair-esm>=2.0.0
      - torch>=2.0          # arm64 macOS wheel includes MPS
      - -e ./fpbase-extractor   # installs the `fpbase-extract` CLI + fpbase_extractor package
